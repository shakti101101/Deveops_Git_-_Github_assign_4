<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

<h1>Student Registration</h1>

{% if error %}
    <p style="color:red;">
        Error: {{ error }}
    </p>
{% endif %}

<form action="/submit" method="POST">

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>

    <br><br>

    <label>Course:</label>
    <input type="text" name="course" required>

    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

</body>
</html>
